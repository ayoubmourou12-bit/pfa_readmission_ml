name: CD — Build & Deploy

on:
  # Se déclenche uniquement quand le CI passe sur main
  workflow_run:
    workflows: ["CI — Tests automatiques"]
    types:
      - completed
    branches:
      - main

  # OU déclenchement manuel depuis GitHub
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Job 1 : Build et push Docker Hub ────────────────────────────────────────
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest

    # Ne s'exécute que si le CI a réussi
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraire les métadonnées (tag = SHA court)
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Tag image : ${SHORT_SHA}"
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull models from DVC
        run: dvc pull
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }} # Si vous utilisez Google Drive


      - name: Build et push image API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/readmission-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/readmission-api:${{ steps.meta.outputs.version }}

      - name: Build et push image Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/readmission-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/readmission-frontend:${{ steps.meta.outputs.version }}

      - name: Résumé du build
        run: |
          echo "✅ Images poussées sur Docker Hub :"
          echo "   API      : ${{ secrets.DOCKERHUB_USERNAME }}/readmission-api:${{ steps.meta.outputs.version }}"
          echo "   Frontend : ${{ secrets.DOCKERHUB_USERNAME }}/readmission-frontend:${{ steps.meta.outputs.version }}"

  # ── Job 2 : Deploy (simulation locale via docker-compose) ───────────────────
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le fichier .env de production
        run: |
          cat > .env << EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          API_PORT=8000
          FRONTEND_PORT=8501
          PYTHONPATH=/app
          EOF

      - name: Pull des nouvelles images
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/readmission-api:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/readmission-frontend:latest

      - name: Lancer les conteneurs (docker compose prod)
        run: |
          docker compose \
            -f docker/docker-compose.prod.yml \
            --env-file .env \
            up -d --wait

      - name: Smoke test — vérifier que l'API répond
        run: |
          echo "Attendre que l'API soit prête..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8000/health)
          echo "Status HTTP : ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "❌ L'API ne répond pas (status=${STATUS})"
            docker logs readmission_api
            exit 1
          fi
          echo "✅ API répond correctement"

      - name: Smoke test — vérifier /predict
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "time_in_hospital": 5,
              "num_lab_procedures": 45,
              "num_procedures": 1,
              "num_medications": 18,
              "number_outpatient": 0,
              "number_inpatient": 1,
              "number_emergency": 0,
              "number_diagnoses": 7,
              "age": "[70-80)",
              "gender": "Male",
              "race": "Caucasian",
              "admission_type_id": 1,
              "discharge_disposition_id": 1,
              "admission_source_id": 7,
              "diag_1": "410",
              "diag_2": "250",
              "diag_3": "401",
              "max_glu_serum": "None",
              "A1Cresult": ">7",
              "change": "Ch",
              "diabetesMed": "Yes",
              "insulin": "Up",
              "metformin": "Steady"
            }')
          echo "Réponse /predict : ${RESPONSE}"
          PRED=$(echo $RESPONSE | python3 -c \
            "import sys, json; d=json.load(sys.stdin); \
             print(d.get('prediction', 'MISSING'))")
          if [ "$PRED" = "MISSING" ]; then
            echo "❌ Champ 'prediction' absent de la réponse"
            exit 1
          fi
          echo "✅ /predict retourne prediction=${PRED}"

      - name: Smoke test — vérifier /model-info
        run: |
          RESPONSE=$(curl -s http://localhost:8000/model-info)
          AUC=$(echo $RESPONSE | python3 -c \
            "import sys, json; d=json.load(sys.stdin); \
             print(d['metrics'].get('auc_pr', 'MISSING'))")
          echo "AUC-PR en production : ${AUC}"
          if [ "$AUC" = "MISSING" ]; then
            echo "❌ Métriques absentes"
            exit 1
          fi
          echo "✅ /model-info OK — AUC-PR=${AUC}"

      - name: Afficher les logs si échec
        if: failure()
        run: |
          echo "=== Logs API ==="
          docker logs readmission_api || true
          echo "=== Logs Frontend ==="
          docker logs readmission_frontend || true

      - name: Arrêter les conteneurs (nettoyage runner)
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.prod.yml \
            --env-file .env \
            down

      - name: Résumé du déploiement
        if: success()
        run: |
          echo "🚀 Déploiement réussi !"
          echo "   Image API      : ${{ secrets.DOCKERHUB_USERNAME }}/readmission-api:latest"
          echo "   Image Frontend : ${{ secrets.DOCKERHUB_USERNAME }}/readmission-frontend:latest"
          echo "   Tag            : ${{ needs.build-and-push.outputs.image_tag }}"
          echo "   Smoke tests    : ✅ /health ✅ /predict ✅ /model-info"